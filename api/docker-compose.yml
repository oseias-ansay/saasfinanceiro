# =====================================================================
# API Financeira — deploy no VPS via Traefik
# =====================================================================
# A API entra em TRÊS redes:
#   • traefik-proxy           -> recebe tráfego externo (HTTPS)
#   • supabase_default        -> fala com o Kong internamente
#   • evolution_evolution-net -> manda mensagem pela Evolution
#
# Não publica porta no host de propósito: quem expõe é o Traefik.
#
# ---------------------------------------------------------------------
# POR QUE A REDE DA EVOLUTION ESTÁ AQUI E NÃO NUM `docker network connect`
# ---------------------------------------------------------------------
# Ligar a rede à mão funciona até o próximo `docker compose up --build`,
# que recria o contêiner e perde a ligação. A API é reconstruída toda
# semana.
#
# E a falha que isso causaria é silenciosa: o DNS de `evolution` para de
# resolver, o envio da resposta falha, e como o cliente de envio nunca
# lança, o lead continua sendo gravado normalmente. Ninguém percebe até
# alguém reclamar que não recebeu resposta.
# =====================================================================
services:
  finance-api:
    build: .
    image: finance-api:latest
    container_name: finance-api
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: "3333"
      # Hostname interno do Kong. O tráfego nunca sai do servidor.
      SUPABASE_URL: http://supabase-kong:8000
    networks:
      - traefik-proxy
      - supabase_default
      - evolution_evolution-net
    labels:
      traefik.enable: "true"
      # Obrigatório quando o container está em mais de uma rede: sem isso o
      # Traefik pode escolher o IP da rede errada e devolver 504.
      traefik.docker.network: "traefik-proxy"

      # HTTP -> redireciona para HTTPS
      traefik.http.routers.finance-api-http.rule: "Host(`api-financeiro.businesstriage.com.br`)"
      traefik.http.routers.finance-api-http.entrypoints: "web"
      traefik.http.routers.finance-api-http.middlewares: "finance-api-redirect"

      # HTTPS com certificado automático (mesmo resolver dos seus outros sites)
      traefik.http.routers.finance-api.rule: "Host(`api-financeiro.businesstriage.com.br`)"
      traefik.http.routers.finance-api.entrypoints: "websecure"
      traefik.http.routers.finance-api.tls.certresolver: "letsencrypt"

      traefik.http.services.finance-api.loadbalancer.server.port: "3333"

      traefik.http.middlewares.finance-api-redirect.redirectscheme.scheme: "https"
      traefik.http.middlewares.finance-api-redirect.redirectscheme.permanent: "true"

networks:
  traefik-proxy:
    external: true
  supabase_default:
    external: true

  # Criada pelo compose da Evolution. O nome vem do nome da pasta do
  # projeto dela — se um dia a pasta mudar, este nome muda junto, e o
  # sintoma é a resposta automática parar sem erro. Confira com:
  #   docker inspect evolution --format '{{range $k,$v := .NetworkSettings.Networks}}{{$k}} {{end}}'
  evolution_evolution-net:
    external: true
